# BabyWatcher Configuration File

# Hardware Settings
hardware:
  platform: "desktop"  # Ghim cứng "desktop" thay vì "auto" -- chạy trên laptop này, không phải Jetson Nano.
                        # Việc này tắt hẳn _setup_jetson() (không gọi nvpmodel/jetson_clocks, vốn không tồn tại trên Windows)
                        # và mọi nhánh export/dùng TensorRT trong src/detector.py (chỉ kích hoạt khi platform bắt đầu bằng "jetson").
  jetson_model: "nano"  # Không dùng khi platform="desktop" -- giữ lại giá trị mặc định phòng khi quay lại triển khai Jetson sau này.
  enable_tensorrt: false  # Không có tác dụng trên laptop (không có TensorRT runtime); đồng thời code đã tự chặn theo platform ở trên.
  enable_csi_camera: false  # CSI camera là phần cứng riêng của Jetson -- laptop dùng webcam USB/tích hợp qua OpenCV VideoCapture bình thường.
  power_mode: "maxn"  # Không dùng khi platform="desktop" -- chỉ có ý nghĩa với lệnh nvpmodel trên Jetson.

# Detection Settings
detection:
  img_size: 640
  conf_thresh: 0.25  # Reduced from 0.4 for better object detection
  hand_mouth_thresh: 45
  hand_obj_thresh: 60
  dynamic_threshold: true  # Tính threshold động dựa trên shoulder width
  enable_fallback_fixed_threshold: true  # Dự phòng bằng ngưỡng cố định khi tín hiệu động không đủ tin cậy
  fallback_hand_mouth_thresh: 60  # Ngưỡng cố định cho khoảng cách tay-miệng
  fallback_hand_object_thresh: 60  # Ngưỡng cố định cho khoảng cách tay-vật
  fallback_object_mouth_thresh: 60  # Ngưỡng cố định cho khoảng cách vật-miệng
  confirmation_frames: 3  # Chỉ báo cảnh báo sau khi cùng một tín hiệu lặp lại 3 frame
  proximity_history_window: 3  # Dùng trung bình lịch sử 3 frame cho tín hiệu gần miệng
  sustained_danger_duration: 0.6  # Chỉ báo cảnh báo sau khi tín hiệu nguy hiểm kéo dài ít nhất 0.6s
  
  # Threshold multipliers for dynamic calculation
  hand_mouth_multiplier: 0.7  # shoulder_width × 0.7 -- tay gần miệng (α_hm)
  hand_object_multiplier: 0.7  # shoulder_width × 0.7
  object_mouth_multiplier: 0.7  # shoulder_width × 0.7 -- vật gần miệng (α_om)
  object_hand_hold_multiplier: 0.3  # shoulder_width × 0.3 -- ngưỡng "đang cầm vật" (α_ho), xem _get_object_proximity_threshold()
  object_region_multiplier: 1.2  # region size for object filtering
  object_mouth_history_window: 3  # require repeated evidence before object-to-mouth alert
  
  # Enhanced object detection for occluded/small objects
  small_object_conf_thresh: 0.25  # Raised from 0.12 -- the retrained babymonitor2 model (P=90%/R=89%, mAP50=95.7%) is confident enough that low-conf noise no longer needs to be let through to catch real objects, and doing so was the main source of SAFE->OBJECT_TO_MOUTH false alarms
  inferred_object_distance_thresh: 22  # If hand-mouth < 25px, infer object is held
  hand_conf_thresh: 0.35  # Lower threshold for hand boxes to improve detection
  hand_near_object_conf_thresh: 0.20  # Raised from 0.10 for the same reason as small_object_conf_thresh above
  hand_near_object_roi_scale: 1.6  # Expand hand ROI for nearby object checks
  object_near_mouth_min_distance: 18  # Only consider objects very close to the mouth as plausible mouth-relevant candidates
  object_size_limit_multiplier: 0.35  # Limit the size of mouth-relevant objects to reduce false positives
  enable_hand_detection: false  # MediaPipe hand detector is disabled; core logic uses pose + object detection
  enable_face_detection: false  # Face detection remains off by default
  mediapipe_confidence: 0.45  # Retained for compatibility, but not used

  # Hazard gallery: reinforces (never gates) OBJECT_TO_MOUTH for objects the
  # caregiver pre-registered as dangerous via register_hazard_objects.py.
  # Empty path disables the feature entirely (default).
  hazard_gallery_path: "hazard_gallery/gallery.json"  # cập nhật tự động qua giao diện đăng ký vật nguy hiểm
  hazard_match_threshold: 0.75  # cosine similarity for a CONFIDENT match (fast-tracked confirmation)
  hazard_possible_match_threshold: 0.5  # cosine similarity for a WEAKER "possible" match -- still counts as an
  # object-to-mouth signal and gets shown on screen, but keeps normal (non-fast-tracked) confirmation timing
  # since the evidence is weaker
  hazard_confirmation_frames: 1  # frames needed to confirm when matched (vs confirmation_frames above)
  hazard_sustained_danger_duration: 0.2  # seconds needed to confirm when matched (vs sustained_danger_duration above)

# Alert Settings
alerts:
  enable_sound: true
  enable_email: true
  enable_webhook: false
  enable_logs: true
  danger_duration_threshold: 3.0  # Cảnh báo sau 3 giây liên tục
  danger_level:
    warning_duration: 2.0  # HAND TO MOUTH
    critical_duration: 3.0  # OBJECT TO MOUTH

# Model Settings
models:
  pose_model_path: "yolo26n-pose.pt"
  object_model_path: "models/babyMonitor2/babymonitor2_best.pt"
  # Optional: hand detection with YOLO hand model - set to "" to disable
  hand_model_path: ""
  # Optional: Face detection - set to "" to disable
  face_model_path: ""
  device: "auto"  # "cpu", "0" (GPU), or "auto" (auto-detect)
  half_precision: false  # Dùng FP16 để tăng tốc độ trên GPU (yêu cầu GPU)
  max_det: 300  # Số objects tối đa detect trên frame
  tensorrt_precision: "fp16"  # "fp32", "fp16", "int8" cho TensorRT

# Performance Settings
performance:
  skip_frames: 0  # Bỏ qua N frames để tăng FPS (0 = process all)
  track_fps: true  # Theo dõi FPS
  enable_profiling: false  # Bật profiling để debug
  batch_size: 1  # Batch processing (1 = xử lý từng frame)
  jetson_optimization: false  # Tắt vì chạy trên laptop, không phải Jetson Nano

# Logging Settings
logging:
  log_dir: "logs"
  log_file: "events_log.csv"
  save_danger_clips: true
  clips_dir: "danger_clips"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR

  # Lưu VIDEO (không chỉ ảnh chụp) khi phát hiện HAND_TO_MOUTH/OBJECT_TO_MOUTH --
  # bổ sung cho save_danger_clips ở trên (ảnh JPG), không thay thế. Dùng bộ đệm
  # cuộn (rolling buffer) để video còn ghi lại được vài giây TRƯỚC lúc nguy hiểm
  # được xác nhận, không chỉ từ đúng khoảnh khắc xác nhận trở đi.
  save_danger_videos: true
  danger_videos_dir: "danger_clips/videos"
  danger_video_pre_seconds: 2.0   # Số giây trước khi nguy hiểm xác nhận cũng được đưa vào video
  danger_video_post_seconds: 3.0  # Quay thêm sau khi hết nguy hiểm, để thấy trẻ đã an toàn trở lại
  danger_video_max_seconds: 15.0  # Giới hạn 1 clip, tránh video quá dài nếu nguy hiểm kéo dài liên tục
  danger_video_fps: 8             # FPS ghi video -- xấp xỉ theo tốc độ xử lý thật trên CPU, không phải FPS camera gốc

# Email Notifications Configuration
# For Gmail:
#   1. Enable 2-Step Verification in Google Account
#   2. Create App Password: https://myaccount.google.com/apppasswords
#   3. Copy the 16-character password and paste as sender_password
# For other providers: Use your email password or app-specific password
email:
  enabled: true
  smtp_server: "smtp.gmail.com"  # Gmail SMTP server
  smtp_port: 587  # TLS port (Gmail: 587, Outlook: 587, Yahoo: 587)
  sender_email: "nghiaproskt0123@gmail.com"  # Your email address
  sender_password: ""  # Gmail App Password (16 characters) -- DO NOT commit a real value here, fill in locally only
  recipient_email: "nghiaproskt0123@gmail.com"  # Where to send alerts
  alert_threshold: 5.0  # Send email when danger > 5 seconds

# Sound Alerts
sound:
  alert_sound_path: "sounds/alarm.wav"
  warning_sound_path: "sounds/warning.mp3"
  volume: 0.8  # 0-1

# Webhook Configuration (để gửi thông báo tới service khác)
# Webhook configuration is disabled; email and sound alerts are used instead.
webhook:
  enabled: false
  url: ""
  retry_count: 3

# Display Settings
display:
  show_skeleton: true
  show_keypoints: true
  show_info_panel: true
  show_fps: true
  frame_width: 960
  frame_height: 960
  enhance_contrast: false
  sharpen: false

# Roboflow Integration for Custom Object Detection
roboflow:
  enabled: false  # Set to true after setting up Roboflow
  api_key: ""  # Get from https://roboflow.com/settings/api
  workspace: ""  # Your Roboflow workspace name
  project: "baby-safety-objects"  # Your project name
  version: 1  # Dataset version
  model_format: "yolov8"  # YOLO format for training
  
  # Local paths
  dataset_dir: "datasets/roboflow"  # Where to download/store dataset
  trained_models_dir: "models/custom"  # Where custom trained models are saved
  
  # Training settings
  training:
    epochs: 50  # Number of training epochs
    batch_size: 16  # Batch size (adjust based on GPU memory)
    img_size: 640  # Image size for training
    patience: 20  # Early stopping patience
    device: "auto"  # GPU device ("0" or "cpu" or "auto")
    
  # Dataset upload settings
  upload:
    enabled: false
    local_dataset_path: ""  # Path to local dataset to upload
    dataset_name: "BabyWatcher-Custom"
    license: "CC BY 4.0"  # License for uploaded dataset
